<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Smokin' Hot Info Techs - Manager Setup</title>
  <link rel="icon" href="data:," />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="manager.js?v=3" defer></script>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 text-gray-900 p-6">
  <div class="max-w-2xl mx-auto">
    <header class="mb-6">
      <h1 class="text-2xl font-bold">Smokin' Hot Info Techs - Manager Setup</h1>
      <p class="text-sm text-gray-600 mt-1">Add teams and set the nomination order before starting the draft.</p>
    </header>

    <section id="auth" class="bg-white p-4 rounded shadow">
      <h2 class="font-semibold">Sign In</h2>
      <div class="mt-3 grid gap-2">
        <input id="email" type="email" placeholder="Email" class="p-2 border rounded" />
        <input id="password" type="password" placeholder="Password" class="p-2 border rounded" />
        <button id="signin" class="bg-blue-600 text-white p-2 rounded">Sign In</button>
      </div>
      <div id="auth-msg" class="text-sm text-red-500 mt-2"></div>
    </section>

    <main id="app" class="hidden">
      <section class="bg-white p-4 rounded shadow">
        <h2 class="font-semibold">Teams and Nomination Order</h2>
        <div class="mt-3 flex gap-2">
          <input id="team-name" placeholder="Team name or manager name" class="flex-1 p-2 border rounded" />
          <button id="add-team" class="bg-green-600 text-white px-3 py-2 rounded">Add Team</button>
        </div>
        <div id="teams-list" class="mt-4 space-y-2"></div>
        <div class="mt-4 flex flex-wrap gap-2">
          <button id="save-order" class="bg-blue-600 text-white px-3 py-2 rounded">Save Order</button>
          <a href="admin.html" class="bg-gray-600 text-white px-3 py-2 rounded">Back to Admin</a>
        </div>
        <div id="message" class="text-sm mt-3"></div>
      </section>
    </main>
  </div>
</body>
</html>
