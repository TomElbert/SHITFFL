<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DraftBoard Admin</title>
  <link rel="icon" href="data:," />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="admin.js?v=18" defer></script>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 p-6">
  <div class="max-w-4xl mx-auto">
    <h1 class="text-2xl font-bold mb-4">Admin — Draft Control</h1>

    <div id="auth" class="bg-white p-4 rounded shadow mb-4">
      <h2 class="font-semibold">Sign In</h2>
      <div class="mt-2 grid grid-cols-3 gap-2">
        <input id="email" placeholder="Email" class="col-span-2 p-2 border rounded" />
        <input id="password" type="password" placeholder="Password" class="p-2 border rounded" />
        <button id="signin" class="col-span-3 mt-2 bg-blue-600 text-white p-2 rounded">Sign In</button>
      </div>
      <div id="auth-msg" class="text-sm text-red-500 mt-2"></div>
    </div>

    <div id="app" class="hidden">
      <div class="bg-white p-4 rounded shadow mb-4">
        <h2 class="font-semibold">Nomination Turn</h2>
        <div id="turn-status" class="mt-2 text-sm text-gray-600"></div>
        <div id="turn-order-list" class="hidden"></div>
        <p class="mt-3 text-sm text-gray-500">Team order is managed on the <a href="manager.html" class="text-blue-600 underline">Manager Team Setup</a> page. Open the <a href="tv.html" target="_blank" class="text-blue-600 underline">Projected TV Display</a> in a separate window.</p>
        <div class="mt-3 flex flex-wrap gap-2">
          <button id="start-draft" class="bg-green-600 text-white px-3 py-2 rounded">Start Draft</button>
          <button id="sync-players" class="bg-indigo-600 text-white px-3 py-2 rounded">Sync Players</button>
          <button id="reset-draft" class="bg-red-600 text-white px-3 py-2 rounded">Reset Entire Draft</button>
        </div>
        <div id="draft-control-msg" class="text-sm text-red-500 mt-2"></div>
        <div id="sync-msg" class="text-sm mt-2"></div>
      </div>
      <div class="grid grid-cols-2 gap-4">
        <div class="bg-white p-4 rounded shadow">
          <h2 class="font-semibold">Draft Player</h2>
          <div class="mt-3">
            <input id="player-search" placeholder="Search available players" class="w-full p-2 border rounded" />
            <div id="player-results" class="mt-2 max-h-40 overflow-auto"></div>
          </div>
          <div class="mt-3 grid grid-cols-2 gap-2">
            <select id="team-select" class="p-2 border rounded"></select>
            <input id="bid-amount" type="number" min="1" step="1" required placeholder="Winning Bid Amount" class="p-2 border rounded" />
          </div>
          <div class="mt-3">
            <button id="next-round" class="hidden w-full bg-purple-600 text-white p-2 rounded mb-2">Proceed to Next Round</button>
            <button id="draft-btn" class="w-full bg-green-600 text-white p-2 rounded">Draft</button>
            <div id="draft-msg" class="text-sm text-red-500 mt-2"></div>
          </div>
        </div>

        <div class="bg-white p-4 rounded shadow">
          <h2 class="font-semibold">Draft Log / Edit</h2>
          <div id="log-list" class="mt-3 max-h-80 overflow-auto"></div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
