<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DraftBoard TV Display</title>
  <link rel="icon" href="data:," />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="tv.js?v=2" defer></script>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-900 text-white min-h-screen p-6 md:p-10">
  <main class="max-w-7xl mx-auto">
    <header class="flex flex-wrap justify-between items-end gap-4 border-b border-gray-700 pb-5">
      <div>
        <p class="text-sm uppercase tracking-widest text-gray-400">Fantasy Auction Draft</p>
        <h1 class="text-4xl md:text-6xl font-bold">DraftBoard Live</h1>
      </div>
      <div id="round-display" class="text-right text-2xl font-semibold text-green-400">Draft not started</div>
    </header>

    <section class="mt-8 grid gap-6 md:grid-cols-3">
      <div class="bg-gray-800 rounded-lg p-6 md:col-span-1">
        <p class="text-sm uppercase text-gray-400">Nominating</p>
        <h2 id="nominator" class="mt-3 text-3xl font-bold">Waiting</h2>
      </div>
      <div class="bg-blue-900 rounded-lg p-6 md:col-span-2">
        <p class="text-sm uppercase text-blue-200">Player Nominated</p>
        <h2 id="nominated-player" class="mt-3 text-4xl md:text-5xl font-bold">Waiting for nomination</h2>
        <p id="nominated-meta" class="mt-2 text-xl text-blue-200"></p>
      </div>
    </section>

    <section class="mt-6 bg-green-900 rounded-lg p-6">
      <p class="text-sm uppercase text-green-200">Auction Winner</p>
      <div class="mt-3 flex flex-wrap items-baseline gap-x-5 gap-y-2">
        <h2 id="winner-player" class="text-3xl md:text-4xl font-bold">No completed auction yet</h2>
        <p id="winner-meta" class="text-xl text-green-200"></p>
      </div>
    </section>

    <section class="mt-8 bg-gray-800 rounded-lg p-6">
      <div class="flex flex-wrap justify-between items-baseline gap-3">
        <h2 class="text-2xl font-semibold">Round Recap</h2>
        <p id="recap-round" class="text-gray-400"></p>
      </div>
      <div class="mt-4 overflow-x-auto">
        <table class="w-full text-left text-lg">
          <thead class="border-b border-gray-600 text-sm uppercase text-gray-400">
            <tr><th class="p-3">Player</th><th class="p-3">Position</th><th class="p-3">Winner</th><th class="p-3">Cost</th></tr>
          </thead>
          <tbody id="recap-list"></tbody>
        </table>
      </div>
    </section>
  </main>
</body>
</html>
